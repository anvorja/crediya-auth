pluginManagement {
    repositories {
        //mavenLocal()
        //maven { url = '...' }
        gradlePluginPortal()
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'MicroservicioAutenticacion'

include ':app-service'
include ':model'
include ':usecase'
project(':app-service').projectDir = file('./applications/app-service')
project(':model').projectDir = file('./domain/model')
project(':usecase').projectDir = file('./domain/usecase')
include ':r2dbc-postgresql'
project(':r2dbc-postgresql').projectDir = file('./infrastructure/driven-adapters/r2dbc-postgresql')
include ':reactive-web'
project(':reactive-web').projectDir = file('./infrastructure/entry-points/reactive-web')
include ':password-encoder'
project(':password-encoder').projectDir = file('./infrastructure/driven-adapters/password-encoder')
include ':jwt-provider'
project(':jwt-provider').projectDir = file('./infrastructure/driven-adapters/jwt-provider')
include ':security-context'
project(':security-context').projectDir = file('./infrastructure/driven-adapters/security-context')