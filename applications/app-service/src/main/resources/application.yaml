server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: "MicroservicioAutenticacion"
  devtools:
    add-properties: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crediya_auth}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

# Los secretos se inyectan por variables de entorno (ver README y deployment/.env.example)
adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:crediya_auth}
    schema: ${DB_SCHEMA:public}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# JWT (RS256). Sin JWT_PRIVATE_KEY se genera una clave efimera (solo desarrollo: los tokens no sobreviven a un reinicio)
security:
  jwt:
    issuer: ${JWT_ISSUER:crediya-auth}
    audience: ${JWT_AUDIENCE:crediya}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
    private-key: ${JWT_PRIVATE_KEY:}
  bcrypt:
    strength: ${BCRYPT_STRENGTH:10}

# Primer administrador: registrar usuarios exige ser ADMIN/ASESOR, asi que alguien debe ser el primero.
# Solo se crea si BOOTSTRAP_ADMIN_PASSWORD esta definida y todavia no existe ningun ADMIN.
bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@crediya.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    documento: ${BOOTSTRAP_ADMIN_DOCUMENTO:0000000001}
    nombres: ${BOOTSTRAP_ADMIN_NOMBRES:Administrador}
    apellidos: ${BOOTSTRAP_ADMIN_APELLIDOS:CrediYa}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
