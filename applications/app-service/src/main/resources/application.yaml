server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: "MicroservicioAutenticacion"
  devtools:
    add-properties: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crediya_auth}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

# Los secretos se inyectan por variables de entorno (ver README y deployment/.env.example)
adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:crediya_auth}
    schema: ${DB_SCHEMA:public}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
